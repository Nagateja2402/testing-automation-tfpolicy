# regression-testing/tests/index.yml
# Source of truth for every test case and its per-level expected outcome.
# Fields:
#   id:          test case directory name under tests/
#   description: human-readable summary of what the test covers
#   suite:       suite prefix (e.g. GR-DEP, PP-PROV)
#   expect:
#     tfpolicy_test: PASS | FAIL | UNKNOWN | VALIDATION_ERROR | ERROR_CONTAINS: <text> | N/A
#     tfp_plan:      PASS | FAIL | UNKNOWN | N/A
#     tfp_apply:     PASS | FAIL | UNKNOWN | N/A

